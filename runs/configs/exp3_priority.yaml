# Experiment 3: priority sweep w_E = 0.1..0.9 at 0 dB (other two tasks split the rest).
# Re-uses the Dirichlet-trained cap-8 models from exp2_main_cap8_2stage (no retraining).
base: base_tokenalloc.yaml
name: exp3_priority
load_checkpoint: runs/exp2_main_cap8_2stage/seed{seed}/model.pt
save_checkpoint: false
eval:
  snrs: [0]
  priorities: [[0.45, 0.45, 0.1], [0.4, 0.4, 0.2], [0.35, 0.35, 0.3], [0.3, 0.3, 0.4], [0.25, 0.25, 0.5],
               [0.2, 0.2, 0.6], [0.15, 0.15, 0.7], [0.1, 0.1, 0.8], [0.05, 0.05, 0.9]]
  policies: [allocator, equal, proportional, snr_only, oracle_greedy]
  saturation: false
